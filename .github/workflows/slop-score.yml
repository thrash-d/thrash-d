# Lints the README of every public repo on this account with slop-linter's
# NoSlop rules and writes the finding count into README.md. Any failure (Vale,
# the rule download, a README fetch) stops the run before README.md is touched.
name: slop-score

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write

env:
  VALE_VERSION: "3.22.0"

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Vale and the NoSlop package
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          curl -sSfL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" | tar -xz -C "$HOME/bin" vale
          mkdir -p "$RUNNER_TEMP/lint/readmes"
          cat > "$RUNNER_TEMP/lint/.vale.ini" <<'EOF'
          StylesPath = styles
          MinAlertLevel = warning
          Packages = https://github.com/thrash-d/slop-linter/releases/latest/download/NoSlop.zip

          [*.md]
          BasedOnStyles = NoSlop
          # Same as slop-linter's own .vale.ini: a quoted word is an example, not a use.
          TokenIgnores = ("[^"\n]+?")
          EOF
          cd "$RUNNER_TEMP/lint"
          "$HOME/bin/vale" sync
          test -d styles/NoSlop

      - name: Fetch READMEs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lint/readmes"
          repos=$(gh api --paginate "users/${GITHUB_REPOSITORY_OWNER}/repos?type=owner" \
            --jq '.[] | select(.fork | not) | select(.archived | not) | select(.private | not) | .name' \
            | grep -vx "${GITHUB_REPOSITORY#*/}")
          for r in $repos; do
            code=$(curl -sS -o "$r.md" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/$r/readme")
            case "$code" in
              200) echo "fetched $r" ;;
              404) rm -f "$r.md"; echo "no README in $r" ;;
              *) echo "::error::README fetch for $r returned HTTP $code"; exit 1 ;;
            esac
          done
          ls *.md >/dev/null

      - name: Lint and update README.md
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lint"
          "$HOME/bin/vale" --no-exit --output=JSON readmes > results.json
          # --no-exit also swallows runtime errors, which Vale prints as a JSON
          # error object. Only a map of file -> alert list is a real result.
          jq -e 'type == "object" and all(.[]; type == "array")' results.json >/dev/null \
            || { echo "::error::Vale failed"; cat results.json; exit 1; }
          n=$(jq '[.[] | length] | add // 0' results.json)
          [[ "$n" =~ ^[0-9]+$ ]] || { echo "::error::Vale produced no usable output"; exit 1; }
          jq -r 'to_entries[] | "\(.key): \(.value | length)"' results.json
          line="[slop-linter](https://github.com/thrash-d/slop-linter) on my public READMEs: $n findings · checked weekly"
          cd "$GITHUB_WORKSPACE"
          grep -q '<!-- slop:start -->' README.md && grep -q '<!-- slop:end -->' README.md
          LINE="$line" perl -0pi -e 's/(<!-- slop:start -->).*?(<!-- slop:end -->)/$1\n$ENV{LINE}\n$2/s' README.md
          echo "$line"

      - name: Commit
        run: |
          set -euo pipefail
          git diff --quiet README.md && { echo "score unchanged"; exit 0; }
          git add README.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore: update slop-linter score"
          git push
